<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Services modal browser test</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../pages/admin/admin.css">

<button id="openRepair" data-ms-edit='{"id":1,"category":"repair","name":"Repair Services","description":"Repair","active":1,"sort_order":0}'>Repair</button>
<button id="openPrinting" data-ms-edit='{"id":2,"category":"printing","name":"Document Printing","description":"Print","active":1,"sort_order":0}'>Printing</button>
<button id="openPhotocopy" data-ms-edit='{"id":3,"category":"printing","name":"Xerox","description":"Copy","active":1,"sort_order":1}'>Photocopy</button>
<button id="openRush" data-ms-edit='{"id":4,"category":"printing","name":"RUSH ID","description":"ID","active":1,"sort_order":2}'>RUSH ID</button>
<button id="openLaminating" data-ms-edit='{"id":5,"category":"printing","name":"Lamination","description":"Laminate","active":1,"sort_order":3}'>Lamination</button>
<button id="openScanning" data-ms-edit='{"id":6,"category":"printing","name":"Scan","description":"Scan","active":0,"sort_order":4}'>Scanning</button>
<button id="openInstallation" data-ms-edit='{"id":7,"category":"installation","name":"Installation Services","description":"Install","active":1,"sort_order":0}'>Installation</button>
<button id="openInvalid" data-ms-edit='{}'>Invalid</button>
<div class="ms-page-error" id="msPageError" role="alert" hidden></div>

<div class="ms-overlay" id="msOverlay" hidden aria-hidden="true">
  <div class="ms-modal" role="dialog" aria-modal="true" aria-labelledby="msModalTitle" tabindex="-1">
    <button class="ms-x" id="msX" type="button" aria-label="Close modal">&times;</button>
    <div class="ms-mhead"><h3 id="msModalTitle"></h3><p id="msModalHelp"></p></div>
    <div class="ms-accent"></div>
    <div class="ms-body">
      <input type="hidden" id="ms_id"><input type="hidden" id="ms_category"><input type="hidden" id="ms_sort">
      <label><input id="ms_active" type="checkbox"><span id="ms_active_label"></span></label>
      <div id="msServiceNameField" hidden><input id="ms_name"></div>
      <textarea id="ms_description"></textarea>
      <div id="ms_catalogEditor"></div>
      <div id="msErr"></div>
    </div>
    <div class="ms-foot"><button id="msCancel">Cancel</button><button id="msSave">Save</button></div>
  </div>
</div>

<div class="ms-confirm-overlay" id="msConfirmOverlay" hidden aria-hidden="true">
  <div class="ms-confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="msConfirmTitle" aria-describedby="msConfirmMessage" tabindex="-1">
    <button class="ms-x" id="msConfirmX" type="button" aria-label="Close modal">&times;</button>
    <div class="ms-confirm-icon">!</div>
    <div><h3 id="msConfirmTitle"></h3><p id="msConfirmMessage"></p></div>
    <div class="ms-confirm-actions"><button id="msConfirmCancel">Cancel</button><button id="msConfirmAccept">Confirm</button></div>
  </div>
</div>
<pre id="result">RUNNING</pre>

      groups: [
        { group_key: "device_type", name: "Devices", active: 1, sort_order: 0, values: [{ value_key: "laptop", label: "Laptop", active: 1, sort_order: 0 }, { value_key: "desktop", label: "Desktop", active: 1, sort_order: 1 }] },
        { group_key: "repair_type", name: "Service Type", active: 1, sort_order: 1, values: [{ value_key: "cleanup", label: "Cleanup", active: 1, sort_order: 0 }, { value_key: "diagnostics", label: "Diagnostics", active: 1, sort_order: 1 }] }
      ],
      rules: [
        { rule_key: "laptop_cleanup", option_value_keys: { device_type: "laptop", repair_type: "cleanup" }, label: "Laptop / Cleanup", price: "500", price_type: "fixed", active: 1, sort_order: 0 },
        { rule_key: "laptop_diagnostics", option_value_keys: { device_type: "laptop", repair_type: "diagnostics" }, label: "Laptop / Diagnostics", price: "300", price_type: "fixed", active: 1, sort_order: 1 },
        { rule_key: "desktop_cleanup", option_value_keys: { device_type: "desktop", repair_type: "cleanup" }, label: "Desktop / Cleanup", price: "600", price_type: "fixed", active: 1, sort_order: 1000 }
      ]
    },
    2: {
      groups: [
        { group_key: "paper_size", name: "Paper Size", active: 1, sort_order: 0, values: [{ value_key: "letter", label: "Letter / Short Bond (8.5x11)", active: 1, sort_order: 0 }, { value_key: "a4", label: "A4", active: 1, sort_order: 1 }, { value_key: "orphan", label: "Configured Without Active Price", active: 1, sort_order: 2 }] },
        { group_key: "color_option", name: "Color Option", active: 1, sort_order: 1, values: [{ value_key: "black_white", label: "Black & White", active: 1, sort_order: 0 }] }
      ],
      rules: [
        { rule_key: "letter_black_white", option_value_keys: { paper_size: "letter", color_option: "black_white" }, label: "Letter / Short Bond (8.5x11) / Black & White", price: "5", price_type: "fixed", active: 1, sort_order: 0 },
        { rule_key: "a4_black_white", option_value_keys: { paper_size: "a4", color_option: "black_white" }, label: "A4 / Black & White", price: "6", price_type: "fixed", active: 1, sort_order: 1 },
        { rule_key: "orphan_black_white", option_value_keys: { paper_size: "orphan", color_option: "black_white" }, label: "Configured Without Active Price / Black & White", price: "7", price_type: "fixed", active: 0, sort_order: 2 }
      ]
    },
    3: {
      groups: [
        { group_key: "paper_size", name: "Paper Size", active: 1, sort_order: 0, values: [{ value_key: "a4", label: "A4", active: 1, sort_order: 0 }] },
        { group_key: "color_option", name: "Color Option", active: 1, sort_order: 1, values: [{ value_key: "black_white", label: "Black & White", active: 1, sort_order: 0 }] }
      ],
      rules: [{ rule_key: "a4_black_white", option_value_keys: { paper_size: "a4", color_option: "black_white" }, label: "A4 / Black & White", price: "3", price_type: "fixed", active: 1, sort_order: 0 }]
    },
    4: {
      groups: [
        { group_key: "package", name: "Package", active: 1, sort_order: 0, values: [{ value_key: "basic", label: "Basic", active: 1, sort_order: 0 }] },
        { group_key: "addon", name: "Add-Ons", active: 1, sort_order: 1, values: [{ value_key: "softcopy", label: "Soft Copy", active: 1, sort_order: 0 }] }
      ],
      rules: [
        { rule_key: "basic", option_value_keys: { package: "basic" }, label: "Basic", price: "100", price_type: "fixed", active: 1, sort_order: 0 },
        { rule_key: "softcopy", option_value_keys: { addon: "softcopy" }, label: "Soft Copy", price: "20", price_type: "fixed", active: 1, sort_order: 1 }
      ]
    },
    5: {
      groups: [{ group_key: "lamination_type", name: "Type", active: 1, sort_order: 0, values: [{ value_key: "a4", label: "A4", active: 1, sort_order: 0 }] }],
      rules: [{ rule_key: "a4", option_value_keys: { lamination_type: "a4" }, label: "A4", price: "40", price_type: "fixed", active: 1, sort_order: 0 }]
    },
    6: {
      groups: [{ group_key: "paper_size", name: "Paper Size", active: 1, sort_order: 0, values: [{ value_key: "a4", label: "A4", active: 1, sort_order: 0 }] }],
      rules: [{ rule_key: "a4", option_value_keys: { paper_size: "a4" }, label: "A4", price: "10", price_type: "fixed", active: 1, sort_order: 0 }]
    },
    7: {
      groups: [
        { group_key: "installation_type", name: "Installation Type", active: 1, sort_order: 0, values: [{ value_key: "setup", label: "Setup", active: 1, sort_order: 0 }] },
        { group_key: "device_type", name: "Devices", active: 1, sort_order: 1, values: [{ value_key: "laptop", label: "Laptop", active: 1, sort_order: 0 }] }
      ],
      rules: [{ rule_key: "laptop_setup", option_value_keys: { device_type: "laptop", installation_type: "setup" }, label: "Laptop / Setup", price: "300", price_type: "fixed", active: 1, sort_order: 0 }]
    }
  };
  window.MS_API_URL = "/fake-services-api";
  window.servitechCsrfToken = () => "test";
  window.servitechAdminToast = { error() {}, success() {}, show() {} };
  window.fetch = async (url, options = {}) => {
    if (!options.method) {
      const id = Number(new URL(url, location.href).searchParams.get("id"));
      return { ok: true, json: async () => ({ ok: true, catalog: structuredClone(catalogs[id]) }) };
    }
    const id = Number(options.body.get("id"));
    const saved = JSON.parse(options.body.get("catalog_json"));
    catalogs[id] = structuredClone(saved);
    return { ok: true, json: async () => ({
      ok: true,
      message: "Saved",
      catalog: structuredClone(saved),
      service: {
        id,
        category: options.body.get("category"),
        name: options.body.get("name"),
        description: options.body.get("description"),
        active: Number(options.body.get("active")),
        sort_order: Number(options.body.get("sort_order")),
        catalog_price_range: "PHP 25.00"
      }
    }) };
  };
</script>
<script>
  if (!location.search.includes("fallback=1")) {
    document.write('<script src="../pages/admin/modal_stack.js"><\/script>');
  }
</script>
<script src="../pages/admin/Services/manage_services.js"></script>
<script>
  (async () => {
    const wait = () => new Promise((resolve) => setTimeout(resolve, 40));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const rectSnapshot = (element) => {
      const rect = element.getBoundingClientRect();
      return { x: rect.x, y: rect.y, width: rect.width, height: rect.height };
    };
    const sameRect = (before, after) => ["x", "y", "width", "height"].every((key) => Math.abs(before[key] - after[key]) < 0.6);
    const editorOverlay = document.querySelector("#msOverlay");
    const editorDialog = document.querySelector(".ms-modal");
    const confirmOverlay = document.querySelector("#msConfirmOverlay");

    const visualMode = new URLSearchParams(location.search).get("visual");
    if (visualMode) {
      document.querySelector("#openPrinting").click();
      await wait();
      if (visualMode === "stack") {
        document.querySelector('[data-group-key="paper_size"] [data-value-active]').click();
        await wait();
      }
      document.querySelector("#result").textContent = `VISUAL ${innerWidth}x${innerHeight}`;
      document.title = `VISUAL-${innerWidth}x${innerHeight}`;
      return;
    }

    document.querySelector("#openInvalid").click();
    await wait();
    assert(!document.querySelector("#msPageError").hidden, "Invalid editor payload failed silently");
    assert(document.querySelector("#msPageError").textContent.includes("Unable to open the service editor"), "Editor failure message is not admin-friendly");

    document.querySelector("#openRepair").click();
    await wait();
    assert(document.querySelector("#msPageError").hidden, "A valid editor open did not clear the page error");
    assert(!editorOverlay.hidden && editorOverlay.classList.contains("is-open"), "Repair editor did not open");
    assert(document.querySelector("[data-add-repair]"), "Repair device/service editor did not render");

    const deviceStateBeforeMove = Object.fromEntries(Array.from(document.querySelectorAll('[data-group-key="device_type"][data-value-key]')).map((row) => [row.dataset.valueKey, row.querySelector("[data-value-active]").checked]));
    document.querySelector('[data-group-key="device_type"][data-value-key="laptop"] [data-action="move-down"]').click();
    await wait();
    assert(Array.from(document.querySelectorAll('[data-group-key="device_type"][data-value-key]')).map((row) => row.dataset.valueKey).join(",") === "desktop,laptop", "Repair device Move Down did not update order");
    assert(Object.entries(deviceStateBeforeMove).every(([key, active]) => document.querySelector(`[data-group-key="device_type"][data-value-key="${key}"] [data-value-active]`).checked === active), "Repair device movement changed active status");
    assert(confirmOverlay.hidden, "Repair device movement opened a status confirmation");

    const laptopCard = Array.from(document.querySelectorAll(".ms-device-card")).find((card) => card.querySelector("summary")?.textContent.includes("Laptop"));
    const laptopRuleOrder = () => Array.from(laptopCard.querySelectorAll(".ms-repair-row")).map((row) => row.dataset.ruleKey);
    const laptopActiveBeforeMove = Array.from(laptopCard.querySelectorAll("[data-rule-active]")).map((input) => input.checked);
    laptopCard.querySelector('[data-action="move-rule-down"]').click();
    await wait();
    const movedLaptopCard = Array.from(document.querySelectorAll(".ms-device-card")).find((card) => card.querySelector("summary")?.textContent.includes("Laptop"));
    assert(Array.from(movedLaptopCard.querySelectorAll(".ms-repair-row")).map((row) => row.dataset.ruleKey).join(",") === "laptop_diagnostics,laptop_cleanup", "Repair service movement did not update order");
    assert(Array.from(movedLaptopCard.querySelectorAll("[data-rule-active]")).every((input, index) => input.checked === laptopActiveBeforeMove[laptopActiveBeforeMove.length - 1 - index]), "Repair service movement changed active status");
    assert(confirmOverlay.hidden, "Repair service movement opened a status confirmation");

    let toggle = document.querySelector("[data-rule-active]");
    const modalBody = document.querySelector(".ms-body");
    modalBody.scrollTop = Math.min(120, modalBody.scrollHeight - modalBody.clientHeight);
    const repairScrollTop = modalBody.scrollTop;
    const repairMarkup = document.querySelector("#ms_catalogEditor").innerHTML;
    const repairRectBeforeConfirm = rectSnapshot(editorDialog);
    const repairBodyRectBeforeConfirm = rectSnapshot(modalBody);
    toggle.click();
    await wait();
    assert(!confirmOverlay.hidden && confirmOverlay.classList.contains("is-open"), "Confirmation was not pushed on top");
    assert(editorOverlay.classList.contains("is-covered") && editorOverlay.inert, "Covered editor was not made fully non-interactive");
    assert(document.documentElement.classList.contains("ms-modal-open") && document.body.classList.contains("ms-modal-open"), "The document and body were not both scroll-locked");
    assert(editorDialog.getAttribute("aria-modal") === "false" && confirmOverlay.querySelector(".ms-confirm-dialog").getAttribute("aria-modal") === "true", "Only the top dialog must be exposed as modal");
    assert(Number(getComputedStyle(confirmOverlay).zIndex) > Number(getComputedStyle(editorOverlay).zIndex), "Confirmation is not above the editor layer");
    assert(getComputedStyle(editorOverlay).pointerEvents === "none", "Covered editor still accepts pointer input");
    assert(sameRect(repairRectBeforeConfirm, rectSnapshot(editorDialog)), "Opening a confirmation shifted or resized the Repair editor");
    assert(sameRect(repairBodyRectBeforeConfirm, rectSnapshot(modalBody)), "Opening a confirmation changed the Repair editor body geometry");
    assert(Math.abs(modalBody.scrollTop - repairScrollTop) < 2, "Opening a confirmation changed the parent modal scroll position");
    assert(getComputedStyle(editorDialog).opacity === "1" && getComputedStyle(editorDialog).transform === "none" && getComputedStyle(editorDialog).filter === "none", "Covered editor received a visual transform, opacity, or filter state");
    document.querySelector("#msConfirmCancel").click();
    await wait();
    toggle = document.querySelector("[data-rule-active]");
    assert(toggle.checked, "Cancel did not restore the repair toggle");
    assert(document.querySelector("#ms_catalogEditor").innerHTML === repairMarkup, "Cancel re-rendered repair content");
    assert(confirmOverlay.hidden && !editorOverlay.classList.contains("is-covered"), "Cancel did not restore the editor stack level");
    assert(!editorOverlay.inert && editorDialog.getAttribute("aria-modal") === "true", "Cancel did not restore editor interactivity and modal semantics");
    assert(sameRect(repairRectBeforeConfirm, rectSnapshot(editorDialog)), "Cancel returned to a shifted or resized Repair editor");
    assert(sameRect(repairBodyRectBeforeConfirm, rectSnapshot(modalBody)), "Cancel changed the Repair editor body geometry");
    assert(document.querySelector("#ms_catalogEditor").getBoundingClientRect().height > 40, "Cancel left the repair editor visually blank");
    assert(toggle.getBoundingClientRect().width > 0, "Cancel left repair controls invisible");
    assert(Math.abs(modalBody.scrollTop - repairScrollTop) < 2, "Cancel changed the parent modal scroll position");

    const newDevice = document.querySelector('[data-new-value="device_type"]');
    newDevice.value = "Desktop";
    document.querySelector('[data-add-value="device_type"]').click();
    await wait();
    document.querySelector("#msConfirmCancel").click();
    await wait();
    assert(newDevice.value === "Desktop" && !editorOverlay.hidden, "Canceling Add Device changed or closed the repair editor");

    const newRepair = document.querySelector('[data-new-repair="laptop"]');
    newRepair.value = "Diagnostics";
    document.querySelector('[data-new-repair-price="laptop"]').value = "200";
    document.querySelector('[data-add-repair="laptop"]').click();
    await wait();
    document.querySelector("#msConfirmCancel").click();
    await wait();
    assert(newRepair.value === "Diagnostics" && !editorOverlay.hidden, "Canceling Add Service Type changed or closed the repair editor");

    toggle.click();
    await wait();
    document.querySelector("#msConfirmX").click();
    await wait();
    assert(!confirmOverlay.classList.contains("is-open") && !editorOverlay.hidden, "Confirmation X closed the wrong modal");

    document.querySelector("[data-rule-active]").click();
    await wait();
    document.querySelector("#msConfirmAccept").click();
    await wait();
    assert(!document.querySelector("[data-rule-active]").checked, "Deactivate did not update the repair draft");
    assert(document.querySelector("#ms_catalogEditor").children.length > 0 && !editorOverlay.hidden, "Deactivate blanked the editor");

    document.querySelector("#msX").click();
    await wait();
    assert(editorOverlay.hidden && !document.body.classList.contains("ms-modal-open") && !document.documentElement.classList.contains("ms-modal-open"), "Closing the final modal did not unlock the document and body");

    document.querySelector("#openPrinting").click();
    await wait();
    assert(document.querySelector(".ms-catalog-matrix"), "Document Printing matrix did not render");
    assert(Array.from(document.querySelectorAll(".ms-value-row")).every((row) => row.querySelectorAll('.ms-switch input[data-action="toggle-active"]').length === 1), "An option row does not have exactly one Active/Inactive control");
    assert(Array.from(document.querySelectorAll(".ms-value-row")).every((row) => row.querySelectorAll('.ms-switch > span[aria-hidden="true"]').length === 1), "An option row renders a duplicate toggle track");
    assert(!document.querySelector(".ms-switch .ms-control-label"), "A technical column label is rendered inside a switch");
    assert(Array.from(document.querySelectorAll(".ms-value-row")).every((row) => row.querySelector(".ms-status-cell") && row.querySelector(".ms-arrange-cell")), "Status and Arrange are not separate row cells");
    assert(Array.from(document.querySelectorAll('.ms-switch input[data-action="toggle-active"]')).every((input) => input.getBoundingClientRect().width <= 1), "A hidden status checkbox overlaps other row actions");
    assert(Array.from(document.querySelectorAll(".ms-value-row")).every((row) => row.scrollWidth <= row.clientWidth + 2), "Arrangement controls overflow an option row");
    assert(document.querySelector(".ms-body").scrollWidth <= document.querySelector(".ms-body").clientWidth + 2, "Editor controls cause horizontal modal-body overflow");
    assert(Array.from(document.querySelectorAll(".ms-order-actions button")).every((button) => button.getBoundingClientRect().height >= 36), "Arrangement controls are not touch-friendly");
    assert(document.querySelector(".ms-matrix-wrap").clientWidth <= document.querySelector(".ms-body").clientWidth, "Price matrix wrapper overflows the modal body");
    const paperOrder = () => Array.from(document.querySelectorAll('[data-group-key="paper_size"][data-value-key]')).map((row) => row.dataset.valueKey);
    const paperStates = () => Object.fromEntries(Array.from(document.querySelectorAll('[data-group-key="paper_size"][data-value-key]')).map((row) => [row.dataset.valueKey, row.querySelector("[data-value-active]").checked]));
    const statusBeforeMove = paperStates();
    document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] [data-action="move-down"]').click();
    await wait();
    assert(paperOrder().join(",") === "a4,letter,orphan", "Move Down did not change only the paper-size order");
    assert(Object.entries(statusBeforeMove).every(([key, active]) => paperStates()[key] === active), "Move Down changed an Active/Inactive state");
    assert(confirmOverlay.hidden, "Move Down incorrectly opened an Active/Inactive confirmation");

    const orderBeforeToggle = paperOrder().join(",");
    document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] [data-value-active]').click();
    await wait();
    document.querySelector("#msConfirmAccept").click();
    await wait();
    assert(paperOrder().join(",") === orderBeforeToggle, "Paper-size Active/Inactive changed display order");
    assert(!document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] [data-value-active]').checked, "Paper-size deactivation did not change status");
    document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] [data-value-active]').click();
    await wait();
    document.querySelector("#msConfirmAccept").click();
    await wait();
    assert(document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] [data-value-active]').checked, "Paper-size reactivation did not restore status");
    assert(document.querySelector('[data-rule-key="letter_black_white"] [data-rule-active]').checked, "Reactivating Short Bond did not preserve its active valid combination");
    assert(!document.querySelector('[data-group-key="paper_size"][data-value-key="letter"] .ms-option-warning'), "Short Bond incorrectly warns despite an active valid combination");
    assert(document.querySelector('[data-group-key="paper_size"][data-value-key="orphan"] .ms-option-warning')?.textContent.includes("at least one active price combination"), "An active customer-hidden option did not show the required admin warning");
    for (const groupKey of ["paper_size", "color_option"]) {
      const addInput = document.querySelector(`[data-new-value="${groupKey}"]`);
      addInput.value = groupKey === "paper_size" ? "Legal" : "Draft Color";
      document.querySelector(`[data-add-value="${groupKey}"]`).click();
      await wait();
      document.querySelector("#msConfirmCancel").click();
      await wait();
      assert(addInput.value && !editorOverlay.hidden, `Canceling Add ${groupKey} changed or closed Document Printing`);
    }
    const price = document.querySelector("[data-rule-price]");
    price.value = "25";
    const printingRectBeforeSave = rectSnapshot(editorDialog);
    const printingScrollBeforeSave = document.querySelector(".ms-body").scrollTop;
    document.querySelector("#msSave").click();
    await wait();
    assert(sameRect(printingRectBeforeSave, rectSnapshot(editorDialog)), "Save confirmation shifted or resized the Document Printing editor");
    assert(document.querySelector(".ms-body").scrollTop === printingScrollBeforeSave, "Save confirmation changed the Document Printing scroll position");
    const confirmRect = document.querySelector(".ms-confirm-dialog").getBoundingClientRect();
    assert(confirmRect.width <= innerWidth && confirmRect.height <= innerHeight, "Confirmation overflows the viewport");
    document.querySelector("#msConfirmCancel").click();
    await wait();
    assert(document.querySelector("[data-rule-price]").value === "25", "Save cancel discarded the changed print price");
    assert(!editorOverlay.hidden && document.body.classList.contains("ms-modal-open"), "Save cancel did not return to the editor");
    assert(sameRect(printingRectBeforeSave, rectSnapshot(editorDialog)), "Save cancel returned to a shifted or resized Document Printing editor");

    document.querySelector("#msSave").click();
    await wait();
    document.querySelector("#msConfirmAccept").click();
    await wait();
    assert(!editorOverlay.hidden && document.querySelector("[data-rule-price]").value === "25", "Successful save did not refresh the open editor in place");
    assert(document.querySelector("#openPrinting").getAttribute("data-ms-edit").includes('"id":2'), "Successful save did not update the service card payload");

    const editorRect = editorDialog.getBoundingClientRect();
    assert(editorRect.width <= innerWidth && editorRect.height <= innerHeight, "Editor overflows the viewport");
    document.querySelector("#msX").click();
    await wait();

    const editorCases = [
      ["#openPhotocopy", ".ms-catalog-matrix", "Photocopy matrix", "toggle"],
      ["#openRush", '[data-new-value="package"]', "RUSH ID package/add-ons editor", "rush-add"],
      ["#openLaminating", '[data-new-value="lamination_type"]', "Lamination type editor", "type-add"],
      ["#openScanning", '[data-new-value="paper_size"]', "Scanning paper-size editor", "toggle"],
      ["#openInstallation", "[data-add-installation]", "Installation device/service editor", "toggle"],
    ];
    for (const [buttonSelector, editorSelector, label, action] of editorCases) {
      document.querySelector(buttonSelector).click();
      await wait();
      assert(!editorOverlay.hidden && document.querySelector(editorSelector), `${label} did not open`);
      if (buttonSelector === "#openScanning") assert(!document.querySelector("#ms_active").checked, "Inactive Scanning did not open as inactive");
      const beforeActionMarkup = document.querySelector("#ms_catalogEditor").innerHTML;
      let toggleState = null;
      if (action === "toggle") {
        toggleState = document.querySelector("[data-rule-active]").checked;
        document.querySelector("[data-rule-active]").click();
      } else if (action === "rush-add") {
        document.querySelector('[data-new-value="package"]').value = "Premium";
        document.querySelector('[data-new-price="package"]').value = "150";
        document.querySelector('[data-add-value="package"]').click();
      } else if (action === "type-add") {
        document.querySelector('[data-new-value="lamination_type"]').value = "Legal";
        document.querySelector('[data-new-price="lamination_type"]').value = "60";
        document.querySelector('[data-add-value="lamination_type"]').click();
      }
      await wait();
      assert(!confirmOverlay.hidden, `${label} confirmation did not open`);
      document.querySelector("#msConfirmCancel").click();
      await wait();
      assert(!editorOverlay.hidden && document.querySelector("#ms_catalogEditor").innerHTML === beforeActionMarkup, `${label} was changed or blanked by confirmation Cancel`);
      assert(document.querySelector("#ms_catalogEditor").getBoundingClientRect().height > 40, `${label} became visually blank after Cancel`);
      if (action === "toggle") {
        assert(document.querySelector("[data-rule-active]").checked === toggleState, `${label} toggle was not restored after Cancel`);
        document.querySelector("[data-rule-active]").click();
        await wait();
        document.querySelector("#msConfirmAccept").click();
        await wait();
        assert(!editorOverlay.hidden && document.querySelector("[data-rule-active]").checked !== toggleState, `${label} confirmation did not update the parent editor`);
        assert(document.querySelector("#ms_catalogEditor").getBoundingClientRect().height > 40, `${label} became visually blank after Confirm`);
      }
      document.querySelector("#msX").click();
      await wait();
    }

    document.querySelector("#result").textContent = "PASS";
    document.title = "PASS";
  })().catch((error) => {
    document.querySelector("#result").textContent = `FAIL: ${error.message}`;
    document.title = "FAIL";
  });
</script>
